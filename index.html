    <!-- Apply saved theme + accent before first paint (no flash) -->
    <script>
      (function () {
        var accents = { indigo: '99 102 241', blue: '59 130 246', teal: '20 184 166', rose: '244 63 94', amber: '245 158 11', violet: '139 92 246' };
        var theme = 'dark', accent = 'indigo';
        try {
          var s = JSON.parse(localStorage.getItem('gauravos-settings') || '{}').state || {};
          if (s.theme === 'light') theme = 'light';
          if (accents[s.accent]) accent = s.accent;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme === 'dark');
        root.style.setProperty('--accent', accents[accent]);
      })();
    </script>
  </head>
